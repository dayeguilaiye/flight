apiVersion: v1
kind: Namespace
metadata:
  name: flight
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flight-deployer
  namespace: flight
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flight-deployer
  namespace: flight
rules:
  - apiGroups: [""]
    resources: [services, secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.containo.us, traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flight-deployer
  namespace: flight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flight-deployer
subjects:
  - kind: ServiceAccount
    name: flight-deployer
    namespace: flight
---
apiVersion: v1
kind: Secret
metadata:
  name: flight-deployer-token
  namespace: flight
  annotations:
    kubernetes.io/service-account.name: flight-deployer
type: kubernetes.io/service-account-token
