name: Flight

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.golangci.yml'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: bash scripts/build.sh
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - run: helm lint deploy/flight --set image.tag=check
      - run: |
          for script in scripts/*.sh deploy/*.sh; do
            bash -n "$script"
          done

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dayeguilaiye/flight:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/dayeguilaiye/flight
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Verify public image access
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          # GHCR packages start private; make the flight package public once after its first publication.
          docker manifest inspect "ghcr.io/dayeguilaiye/flight@$IMAGE_DIGEST" > /dev/null
      - name: Deploy
        env:
          FLIGHT_KUBECONFIG: ${{ secrets.FLIGHT_KUBECONFIG }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$FLIGHT_KUBECONFIG"
          # A queued run must not replace a newer main revision.
          test "$(gh api repos/dayeguilaiye/flight/commits/main --jq .sha)" = "$GITHUB_SHA"
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/flight-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s\n' "$FLIGHT_KUBECONFIG" > "$KUBECONFIG"
          helm upgrade flight deploy/flight --install --namespace flight \
            --set-string image.digest="$IMAGE_DIGEST" --wait --timeout 5m --history-max 10
      - name: Check HTTPS
        run: bash scripts/smoke.sh https://www.hitnrun.cn
